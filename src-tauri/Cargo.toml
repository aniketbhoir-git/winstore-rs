[package]
name = "store"
version = "0.1.0"
description = "Open-source app storefront and package-manager front end"
edition = "2021"
license = "MIT"

[lib]
name = "store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7"

[dependencies]
tauri = "2.12"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"

[dev-dependencies]
tempfile = "3"
